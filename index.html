    <!-- Contact -->
    <section id="contact" class="py-20 bg-[#0f172a] border-t border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-4xl font-bold text-white mb-4">Get In <span class="gradient-text">Touch</span></h2>
                <div class="w-20 h-1 bg-gradient-to-r from-indigo-500 to-purple-500 mx-auto rounded-full"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
                <a href="mailto:ombuyamichael1@gmail.com" class="glass rounded-2xl p-6 border border-white/10 text-center card-hover">
                    <div class="text-4xl mb-4">📧</div>
                    <h4 class="text-white font-semibold">Email</h4>
                    <p class="text-gray-400 text-sm">ombuyamichael1@gmail.com</p>
                </a>
                <a href="https://github.com/ombuyamichael1-ship-it" target="_blank" class="glass rounded-2xl p-6 border border-white/10 text-center card-hover">
                    <div class="text-4xl mb-4">🐙</div>
                    <h4 class="text-white font-semibold">GitHub</h4>
                    <p class="text-gray-400 text-sm">View my code</p>
                </a>
                <a href="tel:0118726921" class="glass rounded-2xl p-6 border border-white/10 text-center card-hover">
                    <div class="text-4xl mb-4">📱</div>
                    <h4 class="text-white font-semibold">Phone</h4>
                    <p class="text-gray-400 text-sm">0118726921</p>
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-[#0f172a] border-t border-white/5 py-8 text-center">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-gray-500 text-sm">&copy; 2026 Michael Ombuya. Built with ❤️ on Acode</p>
            <p class="text-gray-600 text-xs mt-2">Projects fetched from GitHub API</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        // Fetch GitHub repositories
        async function fetchGitHubRepos() {
            try {
                const response = await fetch('https://api.github.com/users/ombuyamichael1-ship-it/repos?sort=updated&per_page=20');
                const repos = await response.json();
                
                // Update stats
                document.getElementById('repoCount').textContent = repos.length;
                
                // Calculate total stars
                const totalStars = repos.reduce((acc, repo) => acc + repo.stargazers_count, 0);
                document.getElementById('starCount').textContent = totalStars;

                // Render projects
                const grid = document.getElementById('projectsGrid');
                grid.innerHTML = '';

                if (repos.length === 0) {
                    grid.innerHTML = '<div class="col-span-3 text-center text-gray-400 py-10">No repositories found</div>';
                    return;
                }

                const languageColors = {
                    'Python': '#3572A5',
                    'JavaScript': '#f1e05a',
                    'HTML': '#e34c26',
                    'CSS': '#563d7c',
                    'Java': '#b07219',
                    'TypeScript': '#2b7489',
                    'C++': '#f34b7d',
                    'PHP': '#4F5D95',
                    'Ruby': '#701516',
                    'Go': '#00ADD8',
                    'Swift': '#ffac45',
                    'Kotlin': '#F18E33',
                    'Vue': '#41b883',
                    'React': '#61dafb',
                    'Dart': '#00B4AB',
                    'Rust': '#dea584',
                    'Shell': '#89e051',
                    'SQL': '#e38c00',
                    'SCSS': '#c6538c',
                    'Lua': '#000080'
                };

                const projectIcons = {
                    'hrms': '🏢',
                    'jobboard': '💼',
                    'portfolio': '🚀',
                    'omnibrain': '🧠',
                    'ecommerce': '🛒',
                    'blog': '✍️',
                    'api': '🔌',
                    'dashboard': '📊',
                    'chat': '💬',
                    'game': '🎮',
                    'todo': '📋',
                    'weather': '🌤️'
                };

                repos.forEach((repo, index) => {
                    const langColor = languageColors[repo.language] || '#6c5ce7';
                    
                    // Get icon based on repo name
                    let icon = '📁';
                    for (const [key, value] of Object.entries(projectIcons)) {
                        if (repo.name.toLowerCase().includes(key)) {
                            icon = value;
                            break;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'project-card glass rounded-2xl p-6 border border-white/10 card-hover';
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-3xl">${icon}</span>
                            <span class="px-2 py-0.5 ${repo.language ? 'bg-indigo-500/20 text-indigo-400' : 'bg-gray-500/20 text-gray-400'} rounded-full text-xs">${repo.language || 'N/A'}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2 truncate">${repo.name.replace(/-/g, ' ').replace(/_/g, ' ')}</h3>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${repo.description || 'No description available'}</p>
                        <div class="repo-stats mb-4">
                            <span><span class="language-dot" style="background-color: ${langColor}"></span>${repo.language || 'N/A'}</span>
                            <span>⭐ ${repo.stargazers_count}</span>
                            <span>🍴 ${repo.forks_count}</span>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <a href="${repo.html_url}" target="_blank" class="flex-1 px-3 py-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg text-xs text-center hover:shadow-lg transition">View on GitHub</a>
                            ${repo.homepage ? `<a href="${repo.homepage}" target="_blank" class="px-3 py-1.5 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg text-xs text-center hover:shadow-lg transition">Live Demo</a>` : ''}
                        </div>
                        <div class="mt-2 text-xs text-gray-500">Updated ${new Date(repo.updated_at).toLocaleDateString()}</div>
                    `;
                    
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching GitHub repos:', error);
                document.getElementById('projectsGrid').innerHTML = `
                    <div class="col-span-3 text-center text-red-400 py-10">
                        ❌ Error loading projects. Please try again later.
                        <br><span class="text-gray-500 text-sm">${error.message}</span>
                    </div>
                `;
            }
        }

        // Fetch projects on page load
        fetchGitHubRepos();
    </script>
</body>
